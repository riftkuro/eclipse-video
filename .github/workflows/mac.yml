name: Mac build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.11.1

      - name: Version
        id: version
        run: echo "value=$(python -c "import re;print(re.search(r\"VERSION = '([^']+)'\", open('app.py').read())[1])")" >> "$GITHUB_OUTPUT"

      - name: Icon
        run: |
          mkdir -p build/eclipse.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/eclipse-app.png --out build/eclipse.iconset/icon_${size}x${size}.png >/dev/null
            double=$((size * 2))
            sips -z $double $double assets/eclipse-app.png --out build/eclipse.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns build/eclipse.iconset -o build/eclipse.icns

      - name: Bundle
        run: |
          pyinstaller --noconfirm --windowed --name "Eclipse Video" \
            --icon build/eclipse.icns \
            --osx-bundle-identifier riftkuro.EclipseVideo \
            --add-data "assets:assets" \
            app.py
          plutil -replace CFBundleShortVersionString -string "${{ steps.version.outputs.value }}" "dist/Eclipse Video.app/Contents/Info.plist"
          plutil -replace NSHighResolutionCapable -bool true "dist/Eclipse Video.app/Contents/Info.plist"
          codesign --force --deep --sign - "dist/Eclipse Video.app"
          ditto -c -k --keepParent "dist/Eclipse Video.app" "Eclipse-Video-${{ steps.version.outputs.value }}-mac-${{ matrix.arch }}.zip"

      - name: Smoke test
        run: |
          "dist/Eclipse Video.app/Contents/MacOS/Eclipse Video" --settings "$RUNNER_TEMP/settings.json" --port 49999 &
          PID=$!
          sleep 8
          kill -0 $PID
          kill $PID

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: Eclipse-Video-*.zip

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: Eclipse-Video-*.zip
